<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IML</title>
  <link rel="stylesheet" href="/static/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <main class="crop-app">
    <header class="page-header">
      <h2 class="subtitle">IML</h2>
      <h1 class="title">Crop Labeller</h1>
    </header>

    <div class="layout">
      <aside id="stats">
        <div class="card">
          <div class="panel-header">
            <h2>Stats</h2>
          </div>
          <div class="stat-line"><strong id="imgPos">0 / 0</strong></div>
          <div class="stat-line">Labelled images: <strong id="labelledCount">0</strong></div>
          <div class="stat-line">Total labels: <strong id="totalLabels">0</strong></div>
          <hr />
          <div class="stat-line section-label"><strong>Per-class totals</strong></div>
          <ul id="classStats"></ul>
        </div>
      </aside>

      <section id="image-panel" class="card image-card">
        <div class="panel-header">
          <h2>Image</h2>
          <div class="panel-summary">Drag to create or adjust crop boxes</div>
        </div>
        <div id="image-container">
          <img id="img" alt="image" />
          <div id="selection-layer"></div>
        </div>
      </section>

      <aside id="right-panel">
        <div class="card controls">
          <div class="panel-header">
            <h2>Controls</h2>
          </div>
          <div class="row">
            <button id="saveBtn">Save</button>
            <button id="deleteSelBtn">Delete Selected</button>
          </div>
          <div class="row">
            <button id="prevBtn">Prev</button>
            <label class="nav-gap">Gap <input id="navGapInput" type="number" min="0" step="1" value="0" /></label>
            <button id="nextBtn">Next</button>
            <button id="randomBtn">Random</button>
          </div>
          <div class="row">
            <button id="prevLabelledBtn">Prev Labelled</button>
            <button id="nextLabelledBtn">Next Labelled</button>
          </div>
          <div class="row">
            <label class="field-label">Class
              <select id="classSelect">
                <option value="0">face</option>
                <option value="1">portrait</option>
                <option value="2">landscape</option>
                <option value="3">full_body</option>
                <option value="4">widescreen</option>
              </select>
            </label>
          </div>
        </div>

        <div class="card">
          <div class="panel-header">
            <h2>Boxes on this image</h2>
          </div>
          <ul id="boxesList" class="boxes"></ul>
        </div>
      </aside>
    </div>
  </main>

  <script>
    window.__IML__ = {
      total_images: {{ total_images }},
      current_index: {{ current_index }},
      total_labels: {{ total_labels }},
      class_stats: {{ class_stats|tojson }},
      labelled_count: {{ labelled_count }}
    };
  </script>
  <script src="/static/script.js"></script>
</body>
</html>
