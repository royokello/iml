<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IML</title>
  <link rel="stylesheet" href="/static/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>IML Crop</h1>

  <div class="layout">
    <aside id="stats">
      <div class="card">
        <div class="stat-line"><strong id="imgPos">0 / 0</strong></div>
        <div class="stat-line">Labelled images: <strong id="labelledCount">0</strong></div>
        <div class="stat-line">Total labels: <strong id="totalLabels">0</strong></div>
        <hr />
        <div class="stat-line"><strong>Per-class totals</strong></div>
        <ul id="classStats"></ul>
      </div>
    </aside>

    <main id="image-panel">
      <div id="image-container">
        <img id="img" alt="image" />
        <div id="selection-layer"></div>
      </div>
    </main>

    <aside id="right-panel">
      <div class="card controls">
        <div class="row">
          <button id="prevBtn">Prev</button>
          <button id="nextBtn">Next</button>
          <button id="randomBtn">Random</button>
        </div>
        <div class="row">
          <button id="prevLabelledBtn">Prev Labelled</button>
          <button id="nextLabelledBtn">Next Labelled</button>
        </div>
        <div class="row">
          <label>Class
            <select id="classSelect">
              <option value="0">face</option>
              <option value="1">portrait</option>
              <option value="2">landscape</option>
              <option value="3">full_body</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="saveBtn">Save</button>
          <button id="deleteSelBtn">Delete Selected</button>
        </div>
      </div>

      <div class="card">
        <div class="stat-line"><strong>Boxes on this image</strong></div>
        <ul id="boxesList" class="boxes"></ul>
      </div>
    </aside>
  </div>

  <script>
    window.__IML__ = {
      total_images: {{ total_images }},
      current_index: {{ current_index }},
      total_labels: {{ total_labels }},
      class_stats: {{ class_stats|tojson }},
      labelled_count: {{ labelled_count }}
    };
  </script>
  <script src="/static/script.js"></script>
</body>
</html>
