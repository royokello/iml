<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IML — Flux2 Gen</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="app" class="app">
    <!-- Header -->
    <header id="header">
      <h2 class="subtitle">IML</h2>
      <h1 class="title">Flux2 Gen</h1>
    </header>

    <!-- Main layout -->
    <div id="layout">
      <!-- Left: main controls + result -->
      <div id="main-col">

        <!-- Row: version + model config -->
        <section id="section-model" class="card">
          <div class="card-row">
            <div class="field-group">
              <label class="label-inline">Version</label>
              <div class="radio-group" id="version-group">
                <label><input type="radio" name="version" value="4b" checked> 4b</label>
                <label><input type="radio" name="version" value="9b"> 9b</label>
              </div>
            </div>
            <div class="field-group">
              <label for="te-select">Text Encoder</label>
              <select id="te-select">
                <option value="">None</option>
              </select>
            </div>
            <div class="field-group">
              <label class="label-inline">Mode</label>
              <div class="radio-group" id="mode-group">
                <label><input type="radio" name="mode" value="distill" checked> Distill</label>
                <label><input type="radio" name="mode" value="base"> Base</label>
              </div>
            </div>
            <div class="field-group">
              <label for="denoiser-select">Denoiser</label>
              <select id="denoiser-select">
                <option value="">None</option>
              </select>
            </div>

          </div>
        </section>

        <!-- Prompt -->
        <section id="section-prompt" class="card">
          <div class="field-group">
            <label for="prompt-input">Prompt</label>
            <textarea id="prompt-input" rows="3"
                      placeholder="A cat holding a sign that says hello world"></textarea>
          </div>
          <div class="field-group">
            <label for="neg-prompt-input">Negative Prompt</label>
            <textarea id="neg-prompt-input" rows="2"
                      placeholder="(only used in Base / CFG mode)"></textarea>
          </div>
        </section>

        <!-- Size + Seed -->
        <section id="section-size" class="card">
          <div class="card-row">
            <div class="field-group size-group">
              <label for="width-input">W</label>
              <input type="number" id="width-input" value="512" step="8" min="64" max="2048">
            </div>
            <div class="field-group size-group">
              <label for="height-input">H</label>
              <input type="number" id="height-input" value="512" step="8" min="64" max="2048">
            </div>
            <div class="field-group size-group">
              <label for="seed-input">Seed</label>
              <input type="number" id="seed-input" value="19930625">
            </div>
          </div>
          <div class="card-row presets-row">
            <button class="preset-btn" data-w="512" data-h="512">512x512</button>
            <button class="preset-btn" data-w="384" data-h="576">384x576</button>
            <button class="preset-btn" data-w="576" data-h="384">576x384</button>
            <button class="preset-btn" data-w="512" data-h="768">512x768</button>
            <button class="preset-btn" data-w="768" data-h="512">768x512</button>
          </div>
        </section>

        <!-- LoRAs -->
        <section id="section-lora" class="card">
          <div class="section-header">
            <h2>LoRAs</h2>
            <button id="lora-add-btn" class="btn-small" disabled>+ Add</button>
          </div>
          <div id="lora-list"></div>
          <div id="lora-empty" class="empty-hint">No LoRAs available for this model</div>
        </section>

        <!-- References -->
        <section id="section-ref" class="card">
          <div class="section-header">
            <h2>References</h2>
            <button id="ref-add-btn" class="btn-small">+ Add</button>
          </div>
          <div class="card-row">
            <div class="field-group">
              <label for="ref-res-input">Target Res</label>
              <input type="number" id="ref-res-input" value="512" step="8" min="64" max="2048">
            </div>
          </div>
          <div id="ref-list" class="ref-grid"></div>
          <div id="ref-empty" class="empty-hint">No reference images added</div>
        </section>

        <!-- Generate button -->
        <section id="section-generate" class="card">
          <button id="gen-btn" class="btn-primary">Generate</button>
          <div id="gen-status" class="status-text"></div>
        </section>

        <!-- Result -->
        <section id="section-result" class="card">
          <div id="result-placeholder" class="result-placeholder">
            <span>generated image appears here</span>
          </div>
          <img id="result-image" class="result-image hidden" alt="generated output">
        </section>

        <!-- Log -->
        <section id="section-log" class="card">
          <pre id="log-output"></pre>
        </section>
      </div>

      <!-- Right: history sidebar -->
      <div id="sidebar">
        <h2>History</h2>
        <div id="history-list"></div>
        <div id="history-empty" class="empty-hint">No outputs yet</div>
      </div>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
